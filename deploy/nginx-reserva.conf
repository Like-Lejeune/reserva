# Nginx devant Reserva. __DOMAIN__ est remplacé par installer.sh.
# Certbot ajoute ensuite le bloc HTTPS et la redirection depuis HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Photos prises au téléphone : le serveur refuse au-delà de 25 Mo, on laisse un peu de marge.
    client_max_body_size 30m;

    # Génération du PDF et attente des paiements Mobile Money : réponses parfois lentes.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Le service worker doit toujours être relu, sinon le téléphone garde une vieille version.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # Fichiers compilés du site : leur nom change à chaque version, on peut les garder longtemps.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
