# Migrations de la base. L'application les applique seule au démarrage ; ce fichier sert aux
# commandes manuelles, lancées depuis le dossier backend/ :
#   alembic revision --autogenerate -m "ajoute telle colonne"   # après avoir modifié app/models.py
#   alembic upgrade head                                         # applique
#   alembic downgrade -1                                         # annule la dernière
[alembic]
script_location = migrations
prepend_sys_path = .
